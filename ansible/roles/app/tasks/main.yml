---
- name: Install Python3 and pip
  dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Install Flask
  pip:
    name: flask
    executable: pip3

- name: Create app user
  user:
    name: appuser
    system: yes
    shell: /sbin/nologin
    create_home: yes
    home: /home/appuser

- name: Create app directory
  file:
    path: /opt/app
    state: directory
    owner: appuser
    group: appuser
    mode: '0755'

- name: Deploy app.py
  template:
    src: app.py.j2
    dest: /opt/app/app.py
    owner: appuser
    group: appuser
    mode: '0644'
  notify: restart app

- name: Deploy systemd service
  template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: '0644'
  notify: restart app

- name: Enable and start app service
  systemd:
    name: app
    enabled: yes
    state: started
    daemon_reload: yes
